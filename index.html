<!DOCTYPE html>
<html>
<head>
  <title>GeoServer City Parcels Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 90vh; width: 100vw; }
    #citySelector { height: 10vh; width: 100vw; text-align: center; padding: 10px; }
    #citySelector select { padding: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="citySelector">
    <label for="cities">Select a city: </label>
    <select id="cities"></select>
  </div>
  <div id="map"></div>
  <script>
    // Initialize the map with a default view
    var map = L.map('map').setView([0, 0], 2);

    // Base URL for GeoServer WFS requests
    var baseUrl = 'https://sim4plan.uah.es/geoserver/parcel_transformation_analysis/ows?service=WFS&version=1.0.0&request=GetFeature&outputFormat=application%2Fjson&srsName=EPSG:4326&maxFeatures=1000000&typeName=parcel_transformation_analysis:';

    // List of city names
    var cities = ["ALICANTE", "A_CORUÑA"];

    // Generate dropdown options dynamically
    var citySelector = document.getElementById('cities');
    cities.forEach(city => {
      var option = document.createElement('option');
      option.value = city;
      option.text = city.replace('_', ' '); // Replace underscores with spaces for display
      citySelector.appendChild(option);
    });

    // Function to generate WFS URLs for each city
    function generateUrls(cities) {
      return cities.reduce((urls, city) => {
        urls[city] = baseUrl + city + "_gdf_fusion";
        return urls;
      }, {});
    }

    // Generate the WFS URLs for the cities
    var wfsUrls = generateUrls(cities);

    // Function to fetch and create a GeoJSON layer
    function createLayer(url) {
      return fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.json();
        })
        .then(data => L.geoJSON(data))
        .catch(err => console.error('Error loading GeoJSON:', err));
    }

    // Create layers for all cities
    var cityLayers = {};

    Promise.all(cities.map(city => 
      createLayer(wfsUrls[city]).then(layer => { cityLayers[city] = layer; })
    )).then(() => {
      // Add initial layer to the map
      cityLayers["ALICANTE"].addTo(map);
      map.fitBounds(cityLayers["ALICANTE"].getBounds());

      // Handle city selection from the dropdown
      document.getElementById('cities').addEventListener('change', function(event) {
        var selectedCity = event.target.value;
        // Remove existing layers
        Object.values(cityLayers).forEach(layer => map.removeLayer(layer));
        // Add the selected city layer
        cityLayers[selectedCity].addTo(map);
        map.fitBounds(cityLayers[selectedCity].getBounds());
      });
    });
  </script>
</body>
</html>
