<!DOCTYPE html>
<html>
<head>
  <title>GeoServer City Parcels Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.vectorgrid/dist/Leaflet.VectorGrid.bundled.js"></script>
  <style>
    #mapContainer { display: flex; }
    #map2021, #map2023 { height: 90vh; width: 50vw; background-color: #f0f0f0; }
    #controls { height: 10vh; width: 100vw; text-align: center; padding: 10px; }
    #controls select { padding: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="controls">
    <label for="cities">Select a city: </label>
    <select id="cities"></select>
  </div>
  <div id="mapContainer">
    <div id="map2021"></div>
    <div id="map2023"></div>
  </div>
  <script>
    // Initialize the maps with a default view
    var map2021 = L.map('map2021').setView([0, 0], 2);
    var map2023 = L.map('map2023').setView([0, 0], 2);

    // Base URL for GeoServer WFS requests
    var baseUrl = 'https://sim4plan.uah.es/geoserver/parcel_transformation_analysis/ows?service=WFS&version=1.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&maxFeatures=1000000&typeName=parcel_transformation_analysis:';

    // List of city names
    var cities = ["ALICANTE", "A_CORUÑA"];

    // Generate dropdown options dynamically
    var citySelector = document.getElementById('cities');
    cities.forEach(city => {
      var option = document.createElement('option');
      option.value = city;
      option.text = city.replace('_', ' '); // Replace underscores with spaces for display
      citySelector.appendChild(option);
    });

    // Function to generate WFS URLs for each city and year
    function generateUrls(cities) {
      return cities.reduce((urls, city) => {
        urls[city] = {
          "2021": `${baseUrl}${city}_gdf_fusion&CQL_FILTER=YEAR=2021`,
          "2023": `${baseUrl}${city}_gdf_fusion&CQL_FILTER=YEAR=2023 OR ATTR_CL='UU_SA'`
        };
        return urls;
      }, {});
    }

    // Generate WFS URLs
    var wfsUrls = generateUrls(cities);

    // Function to create a VectorGrid layer with custom styles from GeoJSON data
    function createVectorGridLayer(data, year) {
      console.log('Creating VectorGrid layer for year:', year, 'with data:', data); // Debugging: log the GeoJSON data
      return L.vectorGrid.slicer(data, {
        vectorTileLayerStyles: {
          sliced: function(properties, zoom) {
            return {
              fillColor: year === "2021" ? '#808080' : '#f4a460', // Darker grey for 2021, light brown for 2023
              fillOpacity: 0.7,
              stroke: false // No border
            };
          }
        },
        interactive: true
      });
    }

    // Fetch and slice GeoJSON data for a city and year
    function fetchAndSliceGeoJSON(url, year) {
      return fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.json();
        })
        .then(data => {
          console.log('Fetched GeoJSON data for year:', year, 'from URL:', url, 'Data:', data); // Debugging: log fetched data
          return createVectorGridLayer(data, year);
        })
        .catch(err => console.error('Error loading GeoJSON:', err));
    }

    // Create layers for all cities and both years
    var cityLayers = {};
    var layerPromises = cities.map(city => {
      cityLayers[city] = {
        "2021": null,
        "2023": null
      };
      return Promise.all([
        fetchAndSliceGeoJSON(wfsUrls[city]["2021"], "2021").then(layer => {
          cityLayers[city]["2021"] = layer;
          if (city === "ALICANTE") {
            layer.addTo(map2021);
          }
        }),
        fetchAndSliceGeoJSON(wfsUrls[city]["2023"], "2023").then(layer => {
          cityLayers[city]["2023"] = layer;
          if (city === "ALICANTE") {
            layer.addTo(map2023);
          }
        })
      ]);
    });

    // Sync maps
    function syncMaps(map1, map2) {
      var isMoving = false;
      map1.on('move', function() {
        if (!isMoving) {
          isMoving = true;
          map2.setView(map1.getCenter(), map1.getZoom(), { animate: false });
          isMoving = false;
        }
      });
      map2.on('move', function() {
        if (!isMoving) {
          isMoving = true;
          map1.setView(map2.getCenter(), map2.getZoom(), { animate: false });
          isMoving = false;
        }
      });
    }

    // Sync the maps
    syncMaps(map2021, map2023);

    // Handle city selection from the dropdown
    document.getElementById('cities').addEventListener('change', function(event) {
      var selectedCity = event.target.value;
      updateLayers(selectedCity);
    });

    function updateLayers(city) {
      // Remove existing layers
      map2021.eachLayer(layer => map2021.removeLayer(layer));
      map2023.eachLayer(layer => map2023.removeLayer(layer));

      // Add new layers
      cityLayers[city]["2021"].addTo(map2021);
      cityLayers[city]["2023"].addTo(map2023);

      // Fit maps to the new layers' bounds
      var bounds = cityLayers[city]["2021"].getBounds().extend(cityLayers[city]["2023"].getBounds());
      map2021.fitBounds(bounds);
      map2023.fitBounds(bounds);
    }

    // Set initial city once layers are loaded
    Promise.all(layerPromises).then(() => {
      updateLayers("ALICANTE");
    });
  </script>
</body>
</html>
