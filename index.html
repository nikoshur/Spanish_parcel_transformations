<!DOCTYPE html>
<html>
<head>
  <title>GeoServer City Parcels Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    
    body, html { height: 100%; margin: 0; padding: 0; }
    #mapContainer { display: flex; height: 90%; width: 100%; }
    #map2021, #map2023 { flex: 1; position: relative; border: 2px solid #000; }
	#separator { width: 2px; background: #000; height: 100%; }
    #controls { height: 10%; width: 100%; text-align: center; padding: 10px; box-sizing: border-box; }
    #controls select, #controls button { padding: 5px; font-size: 16px; }
    .legend { padding: 10px; background: white; line-height: 1.5; color: #555; position: absolute; bottom: 20px; right: 20px; z-index: 1000; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    .legend .title { font-weight: bold; margin-bottom: 5px; }
    .legend .item { display: flex; align-items: center; }
    .legend .item span { width: 20px; height: 20px; display: inline-block; margin-right: 5px; }
    .leaflet-control-container .leaflet-bottom.leaflet-left { display: flex; align-items: center; }
    .epsg-code { background: white; padding: 2px 5px; border: 1px solid #000; border-radius: 3px; font-size: 12px; z-index: 1000; margin-left: 10px; }
  </style>
  </style>
</head>
<body>
  <div id="controls">
    <label for="cities">Select a city: </label>
    <select id="cities"></select>
	<button id="urbanLandUse">Urban Land Use</button>
    <button id="toggleBaseMap">Toggle Base Map</button>
    <button id="visualizeChanges">Visualize Changes</button>
    <button id="classifyChanges">Classify Changes</button>
  </div>
  
  <div id="mapContainer">
    <div id="map2021"></div>
    <div id="separator"></div>
    <div id="map2023"></div>
  </div>
  
  <div id="legend" class="legend">
    <div class="title">Legend</div>
    <div class="item"><span style="background:#d3d3d3;"></span>Common Parcels (UU_SA)</div>
    <div class="item"><span style="background:#808080;"></span>2021</div>
    <div class="item"><span style="background:#f4a460;"></span>2023</div>
    <div class="item"><span style="background:#add8e6;"></span>UU_DA</div>
    <div class="item"><span style="background:#dda0dd;"></span>CU_DA</div>
    <div class="item"><span style="background:#ffffe0;"></span>CU_SA</div>
    <div class="item"><span style="background:#ffcccb;"></span>EXT</div>
    <div class="item"><span style="background:#90ee90;"></span>NEW</div>
  </div>
  <script>
  
    // Initialize the maps with a default view
    var map2021 = L.map('map2021').setView([38.3452, -0.4810], 13); // Center on Alicante
    var map2023 = L.map('map2023').setView([38.3452, -0.4810], 13); // Center on Alicante

	// Add OpenStreetMap grayscale tile layers
	var baseLayer2021 = L.tileLayer('https://{s}.tiles.wmflabs.org/bw-mapnik/{z}/{x}/{y}.png', {
	  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
	});

	var baseLayer2023 = L.tileLayer('https://{s}.tiles.wmflabs.org/bw-mapnik/{z}/{x}/{y}.png', {
	  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
	});
	
    baseLayer2021.addTo(map2021);
    baseLayer2023.addTo(map2023);
	
    // Add scale control (only meters and larger scale)
    var scaleControl = L.control.scale({ maxWidth: 200, metric: true, imperial: false }).addTo(map2021);

    // Add EPSG code next to scale control
    var epsgCodeControl = L.control({ position: 'bottomleft' });
    epsgCodeControl.onAdd = function(map) {
      var div = L.DomUtil.create('div', 'epsg-code');
      div.innerHTML = 'EPSG:3857';
      return div;
    };
    epsgCodeControl.addTo(map2021);
    // Function to toggle base map
    function toggleBaseMap() {
      if (map2021.hasLayer(baseLayer2021)) {
        map2021.removeLayer(baseLayer2021);
      } else {
        map2021.addLayer(baseLayer2021);
      }
      if (map2023.hasLayer(baseLayer2023)) {
        map2023.removeLayer(baseLayer2023);
      } else {
        map2023.addLayer(baseLayer2023);
      }

      // Re-add WMS layers to ensure they are on top
      updateLayers(document.getElementById('cities').value);
    }

    document.getElementById('toggleBaseMap').addEventListener('click', toggleBaseMap);

    // List of city names
    var cities = ["ALICANTE", "A_CORUÑA"];

    // Bounding boxes for the cities in EPSG:4326
    var cityBounds = {
      "ALICANTE": [[38.35629, -0.45784], [38.67096, -0.23124]],
      "A_CORUÑA": [[43.32779, -8.43117], [43.39873, -8.37377]]
    };

    // Generate dropdown options dynamically
    var citySelector = document.getElementById('cities');
    cities.forEach(city => {
      var option = document.createElement('option');
      option.value = city;
      option.text = city.replace('_', ' '); // Replace underscores with spaces for display
      citySelector.appendChild(option);
    });

    // Base URL for GeoServer WMS requests
    var baseUrl = 'https://sim4plan.uah.es/geoserver/parcel_transformation_analysis/wms';

    // Function to generate WMS parameters for each city and year
    function generateParams(city, year, query, style) {
      const format = 'image/png';
      const transparent = true;
      const cql_filter = query;

      return {
        service: 'WMS',
        version: '1.3.0',
        request: 'GetMap',
        layers: `parcel_transformation_analysis:${city}_gdf_fusion`,
        styles: style,
        format: format,
        transparent: transparent,
        cql_filter: cql_filter
      };
    }

    // Function to create WMS layer
    function createWmsLayer(params) {
      return L.tileLayer.wms(baseUrl, {
        layers: params.layers,
        format: params.format,
        transparent: params.transparent,
        version: params.version,
        attribution: "GeoServer",
        styles: params.styles,
        cql_filter: params.cql_filter
      });
    }

    // Create layers for all cities and both years
    var cityLayers = {};
    cities.forEach(city => {
      cityLayers[city] = {
	  
        "common2021": createWmsLayer(generateParams(city, "", "ATTR_CL='UU_SA'", "common")),
		"common2023": createWmsLayer(generateParams(city, "", "ATTR_CL='UU_SA'", "common")),

        "2021_simple": createWmsLayer(generateParams(city, "2021", "YEAR=2021 AND ATTR_CL<>'UU_SA'", "year2021")),
		"2023_simple": createWmsLayer(generateParams(city, "2023", "YEAR=2023 AND ATTR_CL<>'UU_SA'", "year2023")),

        "2021_cl": createWmsLayer(generateParams(city, "2021", "YEAR=2021 AND ATTR_CL<>'UU_SA'", "parcel_classification")),
		"2023_cl": createWmsLayer(generateParams(city, "2023", "YEAR=2023 AND ATTR_CL<>'UU_SA'", "parcel_classification")),

		"urbanLandUse_2021": createWmsLayer(generateParams(city, "2021", "YEAR=2021", "UrbanLandUse")),
		"urbanLandUse_2023": createWmsLayer(generateParams(city, "2023", "YEAR=2023 OR ATTR_CL='UU_SA'", "UrbanLandUse"))

      };
      if (city === "ALICANTE") {
        cityLayers[city]["2021_simple"].addTo(map2021);
        cityLayers[city]["common2021"].addTo(map2021);
        cityLayers[city]["2023_simple"].addTo(map2023);
        cityLayers[city]["common2023"].addTo(map2023);
        map2021.fitBounds(cityBounds["ALICANTE"]);
        map2023.fitBounds(cityBounds["ALICANTE"]);
      }
    });

    // Handle city selection from the dropdown
    document.getElementById('cities').addEventListener('change', function(event) {
      var selectedCity = event.target.value;
      updateLayers(selectedCity);
      map2021.fitBounds(cityBounds[selectedCity]);
      map2023.fitBounds(cityBounds[selectedCity]);
    });

    document.getElementById('urbanLandUse').addEventListener('click', function() {
      var selectedCity = document.getElementById('cities').value;
      updateLayers(selectedCity, "urbanLandUse");
    });
	
	document.getElementById('visualizeChanges').addEventListener('click', function() {
      var selectedCity = document.getElementById('cities').value;
      updateLayers(selectedCity, "visualizeChanges");
    });

    document.getElementById('classifyChanges').addEventListener('click', function() {
      var selectedCity = document.getElementById('cities').value;
      updateLayers(selectedCity, "classifyChanges");
    });
	
	function removeLayers(map) {
      map.eachLayer(layer => {
        if (layer._url && layer._url.indexOf('openstreetmap.org') === -1) { // Remove non-base layers
          console.log('Removing layer:', layer);
          map.removeLayer(layer);
        }
      });
    }
	
    function updateLayers(city, mode = "visualizeChanges") {
      console.log(`Updating layers for city: ${city}`);
      
      // Remove existing layers safely
      removeLayers(map2021);
      removeLayers(map2023);
	  
	  if (cityLayers[city]) {
		if (mode === "visualizeChanges") {
		
		  cityLayers[city]["common2021"].addTo(map2021);
		  cityLayers[city]["2021_simple"].addTo(map2021);
		  cityLayers[city]["common2023"].addTo(map2023);
		  cityLayers[city]["2023_simple"].addTo(map2023);

		} else if (mode === "classifyChanges") {
		
		  cityLayers[city]["common2021"].addTo(map2021);
		  cityLayers[city]["2021_cl"].addTo(map2021);
		  cityLayers[city]["common2023"].addTo(map2023);
		  cityLayers[city]["2023_cl"].addTo(map2023);
		  
		} else if (mode === "urbanLandUse") {
		  
		  cityLayers[city]["urbanLandUse_2021"].addTo(map2021);
		  cityLayers[city]["urbanLandUse_2023"].addTo(map2023);

		}
	  } else {
		console.error(`No layers found for city: ${city}`);
	  }
	}

    // Sync maps
    function syncMaps(map1, map2) {
      var isMoving = false;
      map1.on('move', function() {
        if (!isMoving) {
          isMoving = true;
          map2.setView(map1.getCenter(), map1.getZoom(), { animate: false });
          isMoving = false;
        }
      });
      map2.on('move', function() {
        if (!isMoving) {
          isMoving = true;
          map1.setView(map2.getCenter(), map2.getZoom(), { animate: false });
          isMoving = false;
        }
      });
    }

    // Sync the maps
    syncMaps(map2021, map2023);

    // Set initial city
    updateLayers("ALICANTE");
  </script>
</body>
</html>
