<!DOCTYPE html>
<html>
<head>
  <title>Simple GeoJSON Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Initialize the map
    var map = L.map('map');

    // URL to your GeoJSON file
    var geojsonUrl = 'https://drive.google.com/uc?export=download&id=1IPm9MwbEnKNXUn89FBpqeL9A6n5W2CwD';

    // Load and display the GeoJSON data
    fetch(geojsonUrl)
      .then(response => response.json())
      .then(data => {
        var geojsonLayer = L.geoJSON(data).addTo(map);
        map.fitBounds(geojsonLayer.getBounds()); // Center the map on the GeoJSON layer
      })
      .catch(err => console.error('Error loading GeoJSON:', err));
  </script>
</body>
</html>
